<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Машинка</title>
  <style>
    /* Пейзаж: небо, трава и дорога — всё одним градиентом на body */
    body {
      margin: 0;
      height: 100vh;
      overflow: hidden;
      background: linear-gradient(#8fd3ff 0 70%, #6aa84f 70% 75%, #444 75%);
    }

    /* Солнце — псевдоэлемент body, лишний html-тег не нужен */
    body::before {
      content: "";
      position: absolute;
      top: 40px;
      right: 60px;
      width: 70px;
      height: 70px;
      border-radius: 50%;
      background: #ffd21f;
    }

    /* Кузов машинки */
    .car {
      position: absolute;
      top: calc(75% - 40px);
      left: 0;
      width: 200px;
      height: 50px;
      background: #d62828;
      border-radius: 10px;
      animation: drive 4s ease-out forwards;
    }

    /* Кабина */
    .car::before {
      content: "";
      position: absolute;
      top: -35px;
      left: 40px;
      width: 100px;
      height: 35px;
      background: #8ecae6;
      border: 3px solid #d62828;
      border-bottom: none;
      border-radius: 25px 25px 0 0;
      box-sizing: border-box;
    }

    /* Колесо + его копия через box-shadow */
    .car::after {
      content: "";
      position: absolute;
      bottom: -20px;
      left: 25px;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: #222;
      box-shadow: 110px 0 0 #222;
    }

    /* Выезд слева и остановка за 50px до правого края:
       200px (ширина машинки) + 50px = 250px */
    @keyframes drive {
      from { left: 0; }
      to   { left: calc(100% - 250px); }
    }
  </style>
</head>
<body>
  <div class="car"></div>
</body>
</html>
